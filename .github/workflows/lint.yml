name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          set -e
          for f in bin/*.sh; do
            bash -n "$f"
            echo "OK: $f"
          done
      - name: ShellCheck
        # shellcheck is baked into the self-hosted runner image; a container
        # action would need host<->runner workspace path mapping to work here.
        run: shellcheck --severity=error bin/*.sh
